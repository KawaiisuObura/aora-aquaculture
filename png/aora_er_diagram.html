
<!DOCTYPE html>
<div id="erd" style="padding: 1rem 0;"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});

const diagram = `erDiagram
  USERS {
    uuid id PK
    string full_name
    string email
    string password_hash
    string role
    timestamp created_at
  }
  FARMS {
    uuid id PK
    uuid user_id FK
    string farm_name
    string location
    timestamp created_at
  }
  PONDS {
    uuid id PK
    uuid farm_id FK
    string pond_name
    string pond_type
    float size_m2
    string species
    date stocking_date
    int fingerlings_count
  }
  WATER_QUALITY_LOGS {
    uuid id PK
    uuid pond_id FK
    date log_date
    float ph
    float temperature_c
    float dissolved_oxygen
    text notes
    timestamp created_at
  }
  FEED_LOGS {
    uuid id PK
    uuid pond_id FK
    date log_date
    string feed_type
    float quantity_kg
    float cost_kes
    timestamp created_at
  }
  EXPENSES {
    uuid id PK
    uuid farm_id FK
    date expense_date
    string category
    string description
    float amount_kes
    timestamp created_at
  }
  SALES {
    uuid id PK
    uuid farm_id FK
    uuid pond_id FK
    date sale_date
    float weight_kg
    float price_per_kg
    float total_kes
    string buyer
    timestamp created_at
  }

  USERS ||--o{ FARMS : owns
  FARMS ||--o{ PONDS : contains
  PONDS ||--o{ WATER_QUALITY_LOGS : has
  PONDS ||--o{ FEED_LOGS : has
  FARMS ||--o{ EXPENSES : records
  FARMS ||--o{ SALES : records
  PONDS ||--o{ SALES : linked_to
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd .row-rect-odd path, #erd .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
